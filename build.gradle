buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)'
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'Touhou-AIFun'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            arg '-mixin.config=touhou_aifun.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dirs 'build/machine-qa-libs'
        content { includeGroup 'aifun.qa' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly fg.deobf("maven.modrinth:touhou-little-maid:${touhou_little_maid_version}")
    runtimeOnly fg.deobf("maven.modrinth:touhou-little-maid:${touhou_little_maid_version}")

    // Optional Oculus integration. compileOnly is intentional: users without Oculus must keep
    // loading normally, and Oculus must never be nested into the AIFun jar.
    compileOnly fg.deobf("maven.modrinth:oculus:${oculus_version}")
    // Optional ProjectE integration; never bundled or required for ordinary installations.
    compileOnly fg.deobf('curse.maven:projecte-226410:4901949')
    // SlashBlade remains optional. Compile against the user's CR1.13 baseline.
    def bladeArtifacts = [cr113: 'slashblade-resharped-sword-strange-tales-1467861:8582017',
                          cr115: 'slashblade-resharped-sword-strange-tales-1467861:8805540',
                          upstream: 'slashblade-resharped-1022428:8090912']
    def bladeVersion = project.hasProperty('slashbladeQa') ? (project.findProperty('slashbladeVersion') ?: 'cr113') : 'cr113'
    if (!bladeArtifacts.containsKey(bladeVersion)) throw new GradleException('Unknown slashbladeVersion')
    compileOnly fg.deobf("curse.maven:${bladeArtifacts[bladeVersion]}")
    if (project.hasProperty('slashbladeQa')) {
        runtimeOnly fg.deobf("curse.maven:${bladeArtifacts[bladeVersion]}")
    }
    if (project.hasProperty('projecteQa')) runtimeOnly fg.deobf('curse.maven:projecte-226410:4901949')
    if (project.hasProperty('machineQa')) {
        runtimeOnly fg.deobf('maven.modrinth:iron-furnaces:KHAcRQwi')
        runtimeOnly fg.deobf('aifun.qa:mekanism-github:10.4.16.80')
        runtimeOnly fg.deobf('maven.modrinth:thermal-expansion:Ux2Z0ow1')
        runtimeOnly fg.deobf('curse.maven:thermal-foundation-222880:5443583')
        runtimeOnly fg.deobf('curse.maven:cofh-core-69162:5374122')
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testCompileOnly fg.deobf("maven.modrinth:touhou-little-maid:${touhou_little_maid_version}")
    testRuntimeOnly fg.deobf("maven.modrinth:touhou-little-maid:${touhou_little_maid_version}")
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def replaceProperties = [
        minecraft_version               : minecraft_version,
        minecraft_version_range         : minecraft_version_range,
        forge_version                   : forge_version,
        forge_version_range             : forge_version_range,
        mod_id                          : mod_id,
        mod_name                        : mod_name,
        mod_license                     : mod_license,
        mod_version                     : mod_version,
        mod_group_id                    : mod_group_id,
        mod_authors                     : mod_authors,
        mod_description                 : mod_description,
        touhou_little_maid_version_range: touhou_little_maid_version_range,
        oculus_version_range            : oculus_version_range
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'             : 'touhou_aifun.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The compatibility fixture is opt-in and never included in the release jar.
if (project.hasProperty('guiQa')) {
    def guiQa = sourceSets.create('guiQa')
    if (project.hasProperty('slashbladeQa')) {
        guiQa.java.srcDir('src/slashbladeQa/java')
        guiQa.java.destinationDirectory.set(layout.buildDirectory.dir("classes/java/slashbladeQa-${project.findProperty('slashbladeVersion') ?: 'cr113'}"))
    }
    if (project.hasProperty('machineQa')) guiQa.java.srcDir('src/machineQa/java')
    if (project.hasProperty('projecteQa')) {
        guiQa.java.srcDir('src/projecteQa/java')
        guiQa.resources.srcDir('src/projecteQa/resources')
    }
    def chestQaDirectory = project.hasProperty('cacheAgentQa') ? 'build/agent-cache-qa-server'
            : project.hasProperty('isolatedAgentQa') ? 'build/agent-tail-isolated-qa-server' : 'build/four-chest-qa-server'
    if (project.hasProperty('agentQaRunId')) {
        def runId = project.property('agentQaRunId').toString()
        if (!(runId ==~ /[A-Za-z0-9_-]{1,64}/)) throw new GradleException('agentQaRunId must be a simple isolated-run name')
        chestQaDirectory = "build/agent-qa-${runId}"
    }
    guiQa.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    guiQa.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    minecraft.runs.configureEach {
        mods { aifun_gui_test { source guiQa } }
    }
    minecraft.runs.gameTestServer {
        workingDirectory project.file('build/gui-qa-server')
        if (project.hasProperty('guiQaRunId')) {
            def runId = project.property('guiQaRunId').toString()
            if (!(runId ==~ /[A-Za-z0-9_-]{1,64}/)) throw new GradleException('guiQaRunId must be a simple isolated-run name')
            workingDirectory project.file("build/gui-qa-${runId}")
        }
        if (project.hasProperty('projecteQa')) workingDirectory project.file('build/projecte-qa-server')
        if (project.hasProperty('fourChestQa') || project.hasProperty('fourChestLiveQa') || project.hasProperty('foregroundLiveQa')) {
            workingDirectory project.file(chestQaDirectory)
        }
        property 'forge.enabledGameTestNamespaces', (project.hasProperty('fourChestQa') || project.hasProperty('fourChestLiveQa') || project.hasProperty('foregroundLiveQa'))
                ? 'aifun_gui_test,aifun_four_chest_test,aifun_observation_regression_test,aifun_native_decision_test,aifun_build_test' : 'aifun_gui_test,aifun_observation_regression_test,aifun_native_decision_test,aifun_build_test'
        if (project.hasProperty('nativeDecisionQa')) {
            workingDirectory project.file(chestQaDirectory)
            property 'forge.enabledGameTestNamespaces', 'aifun_native_decision_test'
            if (project.hasProperty('nativeDecisionConfigStressQa')) property 'aifun.nativeDecisionQa.configStress', 'true'
        }
        if (project.hasProperty('combatQa')) {
            workingDirectory project.file(chestQaDirectory)
            property 'forge.enabledGameTestNamespaces', 'aifun_combat_test'
        }
        if (project.hasProperty('slashbladeQa')) {
            workingDirectory project.file("build/slashblade-qa-${project.findProperty('slashbladeVersion') ?: 'cr113'}")
            property 'forge.enabledGameTestNamespaces', 'aifun_slashblade_test'
        }
        if (project.hasProperty('observationRegressionQa')) {
            workingDirectory project.file(chestQaDirectory)
            property 'forge.enabledGameTestNamespaces', 'aifun_observation_regression_test'
        }
        if (project.hasProperty('projecteQa')) property 'forge.enabledGameTestNamespaces', 'aifun_projecte_test'
        if (project.hasProperty('buildQa')) {
            workingDirectory project.file(chestQaDirectory)
            property 'forge.enabledGameTestNamespaces', 'aifun_build_test'
        }
        if (project.hasProperty('agentLiveQa')) property 'aifun.agentQa.sites', file('run/config/touhou_little_maid/sites/llm.json').absolutePath
        if (project.hasProperty('craftingLiveQa')) property 'aifun.craftingQa.sites', file('run/config/touhou_little_maid/sites/llm.json').absolutePath
        if (project.hasProperty('projecteLiveQa')) property 'aifun.projecteQa.sites', file('run/config/touhou_little_maid/sites/llm.json').absolutePath
        if (project.hasProperty('fourChestLiveQa')) property 'aifun.fourChestQa.sites', file('run/config/touhou_little_maid/sites/llm.json').absolutePath
        if (project.hasProperty('foregroundLiveQa')) property 'aifun.foregroundQa.sites', file('run/config/touhou_little_maid/sites/llm.json').absolutePath
        if (project.hasProperty('allowedToolsLiveQa')) {
            workingDirectory project.file(chestQaDirectory)
            property 'forge.enabledGameTestNamespaces', 'aifun_allowed_live_test'
            property 'aifun.allowedQa.sites', file('run/config/touhou_little_maid/sites/llm.json').absolutePath
            property 'aifun.allowedQa.config', file('run/config/touhou-aifun.toml').absolutePath
            if (project.hasProperty('allowedToolsRepeatQa')) property 'aifun.allowedQa.repeat', 'true'
            if (project.hasProperty('allowedToolsAutomaticFirstQa')) property 'aifun.allowedQa.automaticFirst', 'true'
            if (project.hasProperty('allowedToolsLiveModel')) {
                def model = project.property('allowedToolsLiveModel').toString()
                if (!(model ==~ /[A-Za-z0-9._-]{1,128}/)) throw new GradleException('allowedToolsLiveModel must be a simple model id')
                property 'aifun.allowedQa.model', model
            }
            if (project.hasProperty('allowedToolsLiveMode')) {
                def mode = project.property('allowedToolsLiveMode').toString()
                if (!(mode in ['all','baseline','automatic'])) throw new GradleException('allowedToolsLiveMode must be all, baseline or automatic')
                property 'aifun.allowedQa.mode', mode
            }
        }
        if (project.hasProperty('observationLiveQa')) {
            workingDirectory project.file(chestQaDirectory)
            property 'forge.enabledGameTestNamespaces', 'aifun_observation_live_test'
            property 'aifun.observationQa.sites', file('run/config/touhou_little_maid/sites/llm.json').absolutePath
            if (project.hasProperty('observationPausedQa')) property 'aifun.observationQa.pausedTask', 'true'
        }
        if (project.hasProperty('stageDecisionLiveQa')) {
            workingDirectory project.file(chestQaDirectory)
            property 'forge.enabledGameTestNamespaces', 'aifun_stage_live_test'
            property 'aifun.stageQa.sites', file('run/config/touhou_little_maid/sites/llm.json').absolutePath
            property 'aifun.stageQa.config', file('run/config/touhou-aifun.toml').absolutePath
            if (project.hasProperty('stageDecisionLiveMode')) property 'aifun.stageQa.mode', project.property('stageDecisionLiveMode').toString()
            if (project.hasProperty('stageDecisionLiveAutomaticFirst')) property 'aifun.stageQa.automaticFirst', 'true'
        }
        if (project.hasProperty('foregroundRetrieveLiveQa')) property 'aifun.foregroundQa.retrieve', 'true'
        if (project.hasProperty('foregroundLiveTrials')) {
            int trials = Integer.parseInt(project.property('foregroundLiveTrials').toString())
            if (trials < 1 || trials > 10) throw new GradleException('foregroundLiveTrials must be between 1 and 10')
            property 'aifun.foregroundQa.trials', trials.toString()
        }
        if (project.hasProperty('foregroundAmendLiveQa')) property 'aifun.foregroundQa.amend', 'true'
    }
    tasks.named('processGuiQaResources').configure {
        if (project.hasProperty('slashbladeQa')) {
            from('src/guiQa/resources/data/aifun_gui_test/structures/empty.nbt') {
                into 'data/aifun_slashblade_test/structures'
            }
        }
        from('src/guiQa/resources/data/aifun_gui_test/structures/empty.nbt') {
            into 'data/aifun_native_decision_test/structures'
        }
        from('src/guiQa/resources/data/aifun_gui_test/structures/empty.nbt') {
            into 'data/aifun_combat_test/structures'
        }
        from('src/guiQa/resources/data/aifun_gui_test/structures/four_chests.nbt') {
            into 'data/aifun_allowed_live_test/structures'
        }
        from('src/guiQa/resources/data/aifun_gui_test/structures/four_chests.nbt') {
            into 'data/aifun_observation_live_test/structures'
        }
        from('src/guiQa/resources/data/aifun_gui_test/structures/four_chests.nbt') {
            into 'data/aifun_stage_live_test/structures'
        }
        from('src/guiQa/resources/data/aifun_gui_test/structures') {
            include 'four_chests.nbt', 'empty.nbt'
            into 'data/aifun_observation_regression_test/structures'
        }
        from('src/guiQa/resources/data/aifun_gui_test/structures') {
            include 'four_chests.nbt', 'empty.nbt'
            into 'data/aifun_build_test/structures'
        }
    }
    if (project.hasProperty('fourChestQa') || project.hasProperty('fourChestLiveQa') || project.hasProperty('foregroundLiveQa') || project.hasProperty('allowedToolsLiveQa') || project.hasProperty('observationLiveQa') || project.hasProperty('observationRegressionQa') || project.hasProperty('nativeDecisionQa') || project.hasProperty('combatQa') || project.hasProperty('stageDecisionLiveQa') || project.hasProperty('buildQa')) {
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doFirst {
                def fixtureDirectory = file(chestQaDirectory)
                fixtureDirectory.mkdirs()
                def fixtureProperties = new File(fixtureDirectory, 'server.properties')
                if (!fixtureProperties.exists()) fixtureProperties.setText('''level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","structures":{}}
level-name=world
''', 'UTF-8')
                def fixtureSettings = new Properties()
                fixtureProperties.withInputStream { fixtureSettings.load(it) }
                if (fixtureSettings.getProperty('level-type') != 'minecraft:flat')
                    throw new GradleException('Four-chest navigation QA requires its own flat world')
            }
        }
    }
    minecraft.runs.client {
        workingDirectory project.file('build/gui-qa-client')
        if (project.hasProperty('guiQaAuto')) property 'aifun.guiQa.autorun', 'true'
        if (project.hasProperty('machineQa')) {
            workingDirectory project.file('build/machine-qa-client')
            property 'aifun.machineQa.autorun', 'true'
            if (project.hasProperty('machineLiveQa')) property 'aifun.machineQa.sites', file('run/config/touhou_little_maid/sites/llm.json').absolutePath
            jvmArg '-Xmx4G'
        }
        if (project.hasProperty('decisionUiQa')) property 'aifun.decisionUiQa.autorun', 'true'
    }
    if (project.hasProperty('machineQa')) {
        tasks.register('verifyMachineQaClient') {
            doLast {
                def report = file('build/machine-qa-client/machine-client-result.json')
                if (!report.exists() || !new groovy.json.JsonSlurper().parse(report).completed)
                    throw new GradleException(report.exists() ? report.getText('UTF-8') : 'Machine client did not finish its checks')
            }
        }
        tasks.matching { it.name == 'runClient' }.configureEach {
            doFirst { file('build/machine-qa-client/machine-client-result.json').delete() }
            finalizedBy 'verifyMachineQaClient'
        }
    }
    if (project.hasProperty('guiQaAuto')) {
        tasks.register('verifyGuiQaClient') {
            doLast {
                def result = file('build/gui-qa-client/gui-qa-client-result.txt')
                if (!result.exists() || !result.getText('UTF-8').startsWith('PASS:')) {
                    throw new GradleException(result.exists() ? result.getText('UTF-8') : 'GUI client did not finish its checks')
                }
            }
        }
        tasks.matching { it.name == 'runClient' }.configureEach {
            doFirst { file('build/gui-qa-client/gui-qa-client-result.txt').delete() }
            finalizedBy 'verifyGuiQaClient'
        }
    }
    if (project.hasProperty('slashbladeQa')) {
        def bladeQaStarted = 0L
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doFirst { bladeQaStarted = System.currentTimeMillis() }
            doLast {
                // Forge can return exit code 0 on an early mod-loading failure. Require actual tests.
                def log = new File(minecraft.runs.gameTestServer.workingDirectory, 'logs/latest.log')
                def results = log.exists() ? (log.getText('UTF-8') =~ /All (\d+) required tests passed/) : null
                if (!log.exists() || log.lastModified() < bladeQaStarted || results == null || !results.find()
                        || Integer.parseInt(results.group(1)) < 7) {
                    throw new GradleException('SlashBlade server did not complete the required integration tests; inspect its latest.log')
                }
            }
        }
    }
}
